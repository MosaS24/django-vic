{% extends "base.html" %}
{% block title %}Создать викторину{% endblock %}

{% block content %}
<div class="card">
  <h1>Создать викторину</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="row">
      <button class="btn" type="submit">Создать</button>
      <a class="btn secondary" href="{% url 'quiz_list' %}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
