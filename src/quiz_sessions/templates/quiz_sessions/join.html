{% extends "base.html" %}
{% block title %}Вход в викторину{% endblock %}

{% block content %}
<div class="card" style="max-width:520px; margin:0 auto;">
  <h1 style="margin-top:0;">Вход в викторину</h1>

  <p class="muted">Комната: <b>{{ session.code }}</b></p>
  <p class="muted">Викторина: <b>{{ session.quiz.title }}</b></p>

  {% if error %}
    <p style="color:#b91c1c;"><b>{{ error }}</b></p>
  {% endif %}

  <form method="post" class="form">
    {% csrf_token %}
    <label>Имя</label>
    <input type="text" name="name" maxlength="50" placeholder="Например: Марат" autocomplete="nickname" />
    <div class="row" style="margin-top:12px;">
      <button class="btn" type="submit">Войти</button>
    </div>
  </form>

  <p class="muted" style="margin-top:12px;">
    После входа дождись старта ведущего.
  </p>
</div>
{% endblock %}
