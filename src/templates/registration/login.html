{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="card">

    {% csrf_token %}
    {{ form.as_p }}

  </form>
  <p class="muted">Нет аккаунта? <a href="{% url 'signup' %}">Регистрация</a></p>
</div>
{% endblock %}
